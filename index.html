let idx=0, scores={}, dimSum={};

/* ---------- 校验码 ---------- */
function verify(){
  const v=document.getElementById('code').value.trim();
  const err=document.getElementById('code-err');
  if(v===DATA.meta.access_code){ err.textContent=''; start(); }
  else{ err.textContent='校验码不对，这园门不是谁都能进的'; document.getElementById('code').classList.add('shake'); setTimeout(()=>document.getElementById('code').classList.remove('shake'),350); }
}
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && document.getElementById('s-intro').classList.contains('active')) verify(); });

/* ---------- 流程 ---------- */
function start(){ idx=0; scores={}; dimSum={}; show('s-quiz'); render(); }
function reset(){ show('s-intro'); document.getElementById('code').value=''; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }

function render(){
  const q=DATA.questions[idx];
  document.getElementById('bar').style.width=(idx/DATA.questions.length*100)+'%';
  document.getElementById('qno').textContent='第 '+ (idx+1) +' 问 · ' + q.theme;
  document.getElementById('qtext').textContent=q.text;
  const box=document.getElementById('opts'); box.innerHTML='';
  const marks=['甲','乙','丙','丁'];
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="mark">'+marks[i]+'</span>'+o.text;
    b.onclick=()=>pick(o); box.appendChild(b);
  });
}
function pick(opt){
  for(const [name,pts] of Object.entries(opt.credits)) scores[name]=(scores[name]||0)+pts;
  for(const [k,v] of Object.entries(opt.dims||{})) dimSum[k]=(dimSum[k]||0)+v;
  idx++;
  if(idx>=DATA.questions.length) return finish();
  render();
}

/* ---------- 五维计算 ---------- */
function dimScore(k){ return Math.max(1, Math.min(5, 2.5 + (dimSum[k]||0)*0.55)); }
function band(s){ return s>=3.8?'hi':(s<=1.9?'lo':'mid'); }

/* ---------- 雷达图 ---------- */
function radar(scores, charVec, labels){
  const cx=150, cy=150, R=105;
  const angle=i=>-Math.PI/2 + i*2*Math.PI/5;
  const pt=(i,v)=>[cx+Math.cos(angle(i))*R*(v/5), cy+Math.sin(angle(i))*R*(v/5)];
  let g='';
  // 网格
  for(let ring=1;ring<=5;ring++){
    const pts=[0,1,2,3,4].map(i=>pt(i,ring).map(n=>n.toFixed(1)).join(',')).join(' ');
    g+='<polygon points="'+pts+'" fill="none" stroke="#ddd0ab" stroke-width="'+(ring===5?1.2:0.7)+'"/>';
  }
  for(let i=0;i<5;i++) g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+pt(i,5)[0].toFixed(1)+'" y2="'+pt(i,5)[1].toFixed(1)+'" stroke="#ddd0ab" stroke-width="0.7"/>';
  // 角色虚线
  const cp=[0,1,2,3,4].map(i=>pt(i,charVec[i]).map(n=>n.toFixed(1)).join(',')).join(' ');
  g+='<polygon points="'+cp+'" fill="rgba(180,139,60,.07)" stroke="#b48b3c" stroke-width="1.5" stroke-dasharray="5 4"/>';
  // 用户多边形
  const up=[0,1,2,3,4].map(i=>pt(i,scores[i]).map(n=>n.toFixed(1)).join(',')).join(' ');
  g+='<polygon points="'+up+'" fill="rgba(157,44,44,.18)" stroke="#9d2c2c" stroke-width="2"/>';
  for(let i=0;i<5;i++){ const p=pt(i,scores[i]); g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#9d2c2c"/>'; }
  // 轴标签
  const LY=[10,22,292,278,150];
  for(let i=0;i<5;i++){ const p=pt(i,6.15); g+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1].toFixed(1)+(LY[i]?0:4))+'" text-anchor="middle" font-size="12.5" fill="#3b2f2f" font-weight="700">'+labels[i]+'</text>'; }
  document.getElementById('radar').innerHTML=g;
}

/* ---------- 结果 ---------- */
function finish(){
  document.getElementById('bar').style.width='100%';
  const top=Math.max(...DATA.characters.map(c=>scores[c.name]||0));
  const leaders=DATA.characters.filter(c=>(scores[c.name]||0)===top);
  let best={c:leaders[0],s:top};
  if(leaders.length>1){
    const vec=DATA.meta.dims.map(d=>dimScore(d.key));
    let bestD=Infinity;
    for(const c of leaders){
      const d=Math.hypot(...DATA.meta.dims.map((_,i)=>vec[i]-c.vector[i]));
      if(d<bestD){bestD=d;best={c,s:top};}
    }
  }
  const c=best.c;
  const dkeys=DATA.meta.dims.map(d=>d.key);
  const myScores=dkeys.map(dimScore);
  const b=[]; for(const k of dkeys) b.push(band(dimScore(k)));

  document.getElementById('r-lead').textContent='园门开启 · 你的判词落定（契合 '+best.s+' 分）';
  document.getElementById('r-name').textContent=c.name;
  document.getElementById('r-title').textContent='『'+c.title+'』';
  document.getElementById('r-quote').textContent='你是 '+c.keywords.join(' · ')+' 的那一种人。'+c.highlight;
  document.getElementById('r-kw').innerHTML=c.keywords.map(k=>'<span>'+k+'</span>').join('');

  radar(myScores, c.vector, DATA.meta.dims.map(d=>d.label));

  const box=document.getElementById('dims'); box.innerHTML='';
  DATA.meta.dims.forEach((d,i)=>{
    const bn=b[i], pct=Math.round(myScores[i]/5*100);
    const bandTxt=BAND_TEXT[d.key][bn], bandCls=bn==='hi'?'hi':(bn==='lo'?'lo':'');
    const bandName=bn==='hi'?'偏强':(bn==='lo'?'偏弱':'适中');
    box.innerHTML+='<div class="block"><h4>'+d.label+'<span class="band '+bandCls+'">'+bandName+'</span></h4>'+
      '<div class="dimbar"><i style="width:'+pct+'%"></i></div>'+
      '<p style="font-size:12px;color:#8b7c68;margin-top:2px">'+d.desc+'</p>'+
      '<p>'+bandTxt+'</p></div>';
  });

  document.getElementById('r-hl').textContent=c.highlight;
  document.getElementById('r-wk').textContent=c.weakness;
  document.getElementById('r-ad').textContent=c.advice;
  document.getElementById('r-mate').textContent=c.soulmate;
  RESULT={c:c,my:myScores};
  show('s-result');
}

let RESULT=null;
function wrapTextL(ctx,text,maxW){
  const lines=[];let line='';
  for(const ch of text){
    const t=line+ch;
    if(ctx.measureText(t).width>maxW){lines.push(line);line=ch;}
    else line=t;
  }
  if(line)lines.push(line);
  return lines;
}
function setF(ctx,px,bold){
  ctx.font=(bold?'bold ':'')+px+'px "Noto Serif SC","Songti SC","SimSun",serif';
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function radarCard(ctx,cx,cy,R,labels,mine,other){
  const n=labels.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(111,95,82,.28)';
  for(let l=1;l<=4;l++){
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a=ang(i%n),r=R*l/4;
      const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a=ang(i);
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
  }
  ctx.stroke();
  ctx.fillStyle='#6f5f52';
  setF(ctx,15);
  ctx.textAlign='center';
  for(let i=0;i<n;i++){
    const a=ang(i);
    ctx.fillText(labels[i],cx+(R+34)*Math.cos(a),cy+(R+34)*Math.sin(a)+5);
  }
  const poly=(vals,close)=>{
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a=ang(i%n),r=vals[i%n]/5*R;
      const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    close?ctx.closePath():0;
  };
  poly(other,1);
  ctx.setLineDash([6,5]);
  ctx.strokeStyle='rgba(180,139,60,.95)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.setLineDash([]);
  poly(mine,1);
  ctx.fillStyle='rgba(157,44,44,.16)';
  ctx.fill();
  ctx.strokeStyle='#9d2c2c';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.fillStyle='#9d2c2c';
  for(let i=0;i<n;i++){
    const a=ang(i),r=mine[i]/5*R;
    ctx.beginPath();
    ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),3.5,0,7);
    ctx.fill();
  }
}
function exportResult(){
  if(!RESULT)return;
  const c=RESULT.c,my=RESULT.my;
  const dims=DATA.meta.dims;
  const SERIF='"Noto Serif SC","Songti SC","SimSun",serif';
  const W=750,PAD=52,BW=W-PAD*2;
  const meas=document.createElement('canvas').getContext('2d');

  // ---- 预排版：测量字号与绘制字号严格一致 ----
  setF(meas,24);
  const quoteL=wrapTextL(meas,'你是 '+c.keywords.join(' · ')+' 的那一种人。'+c.highlight,BW);
  setF(meas,20);
  const dimBlocks=dims.map((d,i)=>{
    const bn=(my[i]>=3.8?'hi':(my[i]<=2.4?'lo':'mid'));
    const bnName=bn==='hi'?'偏强':(bn==='lo'?'偏弱':'适中');
    const txtL=wrapTextL(meas,BAND_TEXT[d.key][bn],BW-48-14);
    const bh=110+(txtL.length-1)*28;
    return {d,pct:Math.round(my[i]/5*100),bn,bnName,txtL,bh};
  });
  setF(meas,21);
  const depth=[
    {t:'你 的 高 光',x:c.highlight},
    {t:'你 的 软 肋',x:c.weakness},
    {t:'给 你 的 话',x:c.advice},
    {t:'园里最懂你的人',x:c.soulmate}
  ].map(b=>({t:b.t,x:b.x,lines:wrapTextL(meas,b.x,BW-48),bh:94+(wrapTextL(meas,b.x,BW-48).length-1)*36}));

  setF(meas,22);
  const kws=c.keywords;
  const kwW=kws.map(k=>meas.measureText(k).width+44);

  // ---- 总高预算：与绘制增量一一对应 ----
  let H=118;
  H+=64;                     // 主标题
  H+=34;                     // 副标题+分隔线
  H+=54;                     // 判词小标
  H+=86;                     // 角色名
  H+=64;                     // 称号
  H+=quoteL.length*36+30;    // 判词引言+间距
  H+=88;                     // 关键词 chips→五维标题
  H+=370;                    // 雷达+图例
  H+=54;                     // 五维卡起点
  dimBlocks.forEach(b=>{H+=b.bh+14;});
  H+=36+52;                  // 深度解读标题
  depth.forEach(b=>{H+=b.bh+16;});
  H+=30+42+34+44;            // 页脚
  H+=56;                     // 底部留白

  const S=2;
  const cv=document.createElement('canvas');
  cv.width=W*S;cv.height=Math.round(H*S);
  const ctx=cv.getContext('2d');
  ctx.scale(S,S);

  // ---- 背景 ----
  ctx.fillStyle='#f6efdf';ctx.fillRect(0,0,W,H);
  const grd=ctx.createRadialGradient(W*0.2,H*0.05,0,W*0.2,H*0.05,W*0.6);
  grd.addColorStop(0,'rgba(180,139,60,.10)');grd.addColorStop(1,'rgba(180,139,60,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#b48b3c';ctx.lineWidth=2;
  ctx.strokeRect(18,18,W-36,H-36);
  ctx.strokeStyle='rgba(157,44,44,.55)';ctx.lineWidth=1;
  ctx.strokeRect(26,26,W-52,H-52);

  let y=118;const cx=W/2;
  ctx.textAlign='center';
  // ---- 头部 ----
  ctx.fillStyle='#9d2c2c';setF(ctx,46,1);
  ctx.fillText(DATA.meta.title,cx,y);y+=64;
  ctx.fillStyle='#8b7c68';setF(ctx,22);
  ctx.fillText(DATA.meta.subtitle,cx,y);y+=34;
  ctx.strokeStyle='rgba(180,139,60,.7)';
  ctx.beginPath();ctx.moveTo(cx-120,y);ctx.lineTo(cx+120,y);ctx.stroke();

  // ---- 判词区 ----
  y+=54;
  ctx.fillStyle='#b48b3c';setF(ctx,24);
  ctx.fillText('— 园门开启 · 你的判词落定 —',cx,y);y+=86;
  ctx.fillStyle='#3b2f2f';setF(ctx,78,1);
  ctx.fillText(c.name,cx,y);y+=64;
  ctx.fillStyle='#b48b3c';setF(ctx,30);
  ctx.fillText('『'+c.title+'』',cx,y);y+=58;
  ctx.fillStyle='#3b2f2f';setF(ctx,24);
  quoteL.forEach(l=>{ctx.fillText(l,cx,y);y+=36;});
  y+=30;
  // 关键词 chips
  let kwTotal=kwW.reduce((a,b)=>a+b,0)+(kws.length-1)*14;
  let kx=cx-kwTotal/2;
  kws.forEach((k,i)=>{
    ctx.fillStyle='#9d2c2c';
    rr(ctx,kx,y-30,kwW[i],44,22);ctx.fill();
    ctx.fillStyle='#f6efdf';setF(ctx,22);
    ctx.fillText(k,kx+kwW[i]/2,y+1);
    kx+=kwW[i]+14;
  });

  // ---- 五维雷达 ----
  y+=88;
  ctx.fillStyle='#9d2c2c';setF(ctx,30,1);
  ctx.fillText('五 维 人 格 画 像',cx,y);
  const rcy=y+34+150;
  radarCard(ctx,cx,rcy,118,dims.map(d=>d.label),my,c.vector);
  y=rcy+152+34;
  setF(ctx,20);
  ctx.fillStyle='#9d2c2c';ctx.fillRect(cx-150,y-8,12,12);
  ctx.fillStyle='#8b7c68';ctx.textAlign='left';ctx.fillText('你的画像',cx-132,y+4);
  ctx.fillStyle='#b48b3c';ctx.fillRect(cx-38,y-8,12,12);
  ctx.fillStyle='#8b7c68';ctx.fillText('你最像的角色',cx-20,y+4);
  ctx.textAlign='center';

  // ---- 五维解读卡 ----
  y+=54;
  dimBlocks.forEach(b=>{
    ctx.fillStyle='#fffdf6';
    rr(ctx,PAD,y,BW,b.bh,12);ctx.fill();
    ctx.strokeStyle='#dccfae';ctx.lineWidth=1;ctx.stroke();
    setF(ctx,24,1);
    ctx.fillStyle='#3b2f2f';
    ctx.textAlign='left';ctx.fillText(b.d.label,PAD+24,y+34);
    setF(meas,24,1);
    const tagX=PAD+24+meas.measureText(b.d.label).width+16;
    ctx.fillStyle=b.bn==='hi'?'#9d2c2c':(b.bn==='lo'?'#6f5f52':'#b48b3c');
    rr(ctx,tagX,y+14,58,30,15);ctx.fill();
    ctx.fillStyle='#fffdf6';setF(ctx,18);
    ctx.textAlign='center';ctx.fillText(b.bnName,tagX+29,y+35);
    ctx.textAlign='left';
    ctx.fillStyle='#efe5cc';
    rr(ctx,PAD+24,y+50,BW-48,10,5);ctx.fill();
    ctx.fillStyle='#9d2c2c';
    rr(ctx,PAD+24,y+50,(BW-48)*b.pct/100,10,5);ctx.fill();
    ctx.fillStyle='#6f5f52';setF(ctx,20);
    let ty=y+86;
    b.txtL.forEach(l=>{ctx.fillText(l,PAD+24,ty);ty+=28;});
    y+=b.bh+14;
    ctx.textAlign='center';
  });

  // ---- 深度解读 ----
  y+=36;
  ctx.fillStyle='#9d2c2c';setF(ctx,30,1);
  ctx.fillText('深 度 解 读',cx,y);y+=52;
  depth.forEach(b=>{
    ctx.fillStyle='#fffdf6';
    rr(ctx,PAD,y,BW,b.bh,12);ctx.fill();
    ctx.strokeStyle='#dccfae';ctx.stroke();
    ctx.fillStyle='#9d2c2c';setF(ctx,24,1);
    ctx.textAlign='left';ctx.fillText(b.t,PAD+24,y+34);
    ctx.fillStyle='#3b2f2f';setF(ctx,21);
    let ty=y+70;
    b.lines.forEach(l=>{ctx.fillText(l,PAD+24,ty);ty+=36;});
    y+=b.bh+16;ctx.textAlign='center';
  });

  // ---- 页脚 ----
  y+=30;
  ctx.strokeStyle='rgba(180,139,60,.6)';
  ctx.beginPath();ctx.moveTo(cx-110,y);ctx.lineTo(cx+110,y);ctx.stroke();y+=42;
  ctx.fillStyle='#8b7c68';setF(ctx,19);
  ctx.fillText('题面框架源自公有领域 Rosenberg 自尊量表 · 文案原创',cx,y);y+=34;
  ctx.fillText('娱乐向，非心理诊断',cx,y);y+=44;
  ctx.fillStyle='#9d2c2c';setF(ctx,24,1);
  ctx.fillText((DATA.meta.share_brand||'')+new Date().toLocaleDateString('zh-CN'),cx,y);

  // ---- 展示浮层 ----
  const url=cv.toDataURL('image/jpeg',0.92);
  let mask=document.getElementById('export-mask');
  if(!mask){
    mask=document.createElement('div');
    mask.id='export-mask';mask.className='export-mask';
    mask.innerHTML='<img id="export-img"><div class="export-hint"><b>长按图片</b>保存到相册，即可转发朋友圈 / 小红书<br>（电脑端点下方按钮下载）</div><div class="export-btns"><button id="export-dl">下载图片</button><button class="ghost" id="export-close">关 闭</button></div>';
    document.body.appendChild(mask);
    document.getElementById('export-close').onclick=()=>mask.remove();
    document.getElementById('export-dl').onclick=()=>{
      const a=document.createElement('a');
      a.href=document.getElementById('export-img').src;
      a.download='金陵十二钗测试结果_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'')+'.png';
      a.click();
    };
    mask.addEventListener('click',e=>{if(e.target===mask)mask.remove();});
  }
  document.getElementById('export-img').src=url;
  mask.style.display='flex';
}
</script>
